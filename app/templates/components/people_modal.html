{% import "components/ui.html" as ui %}

{#
  "New chat" picker: everyone you can chat with, grouped A–Z like WhatsApp.
  Reuses the auth dialog's enter/exit animations (.auth-dialog).
#}
<dialog
  id="people-dialog"
  aria-labelledby="people-dialog-title"
  class="auth-dialog mb-0 mt-auto w-full max-w-none overflow-visible bg-transparent p-0 text-ink backdrop:bg-ink/40 backdrop:backdrop-blur-[2px] sm:m-auto sm:w-[calc(100%-2rem)] sm:max-w-md"
>
  <div class="flex h-[85dvh] flex-col overflow-hidden rounded-t-[28px] bg-white shadow-2xl shadow-ink/20 ring-1 ring-black/5 sm:h-[min(640px,85dvh)] sm:rounded-[28px]">
    <div class="shrink-0 px-5 pb-3 pt-3 sm:px-6 sm:pt-5">
      <div class="mx-auto mb-3 h-1.5 w-10 rounded-full bg-slate-200 sm:hidden" aria-hidden="true"></div>

      <div class="flex items-center justify-between gap-3">
        <div>
          <h2 id="people-dialog-title" class="text-xl font-bold tracking-tight">New chat</h2>
          <p data-people-count class="text-sm text-slate-500" aria-live="polite"></p>
        </div>
        <button
          type="button"
          data-people-close
          aria-label="Close"
          class="grid size-9 place-items-center rounded-full text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand"
        >
          {{ ui.icon("x", "size-5") }}
        </button>
      </div>

      <label class="group relative mt-4 block">
        <span class="sr-only">Search people</span>
        <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 transition-colors group-focus-within:text-brand">
          {{ ui.icon("search", "size-5") }}
        </span>
        <input
          id="people-search"
          type="search"
          placeholder="Search name or username"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          maxlength="100"
          class="h-11 w-full rounded-full bg-slate-100 pl-11 pr-4 text-[15px] outline-none ring-brand transition placeholder:text-slate-400 focus:bg-white focus:ring-2"
        >
      </label>
    </div>

    <div data-people-scroll class="relative min-h-0 flex-1 overflow-y-auto overscroll-contain border-t border-slate-100 pb-[env(safe-area-inset-bottom)]">
      <div data-people-list role="list" aria-label="People"></div>
      <p data-people-empty class="hidden px-6 py-16 text-center text-sm text-slate-500"></p>
    </div>
  </div>
</dialog>
