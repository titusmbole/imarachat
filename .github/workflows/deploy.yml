name: Build & Deploy Imarachat to production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/imarachat:latest .
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/imarachat:latest

      - name: Login to server and deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/imarachat:latest
            docker stop imarachat || true
            docker rm imarachat || true
            docker run -d --name imarachat --restart unless-stopped -p 127.0.0.1:6766:8000 \
              --env-file /home/administrator/files/.env-corechat \
              -v /home/administrator/files/uploads:/app/uploads \
              ${{ secrets.DOCKER_USERNAME }}/imarachat:latest
